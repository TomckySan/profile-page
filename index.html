<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Tomcky - Forward Deployed Engineer / Product Management / Product Ops"
    >
    <title>Tomcky</title>
    <script>
      (() => {
        const savedTheme = (() => {
          try {
            return localStorage.getItem("theme");
          } catch {
            return null;
          }
        })();

        if (savedTheme === "light" || savedTheme === "dark") {
          document.documentElement.dataset.theme = savedTheme;
        }
      })();
    </script>
    <link rel="icon" href="profile.jpg" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="preload"
      href="https://fonts.gstatic.com/s/nunito/v32/XRXI3I6Li01BKofiOc5wtlZ2di8HDGUmdTQ3j6zbXWjgeg.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    >
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@600&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <button class="theme-toggle" type="button" aria-label="Switch to light mode">
      <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2"></path>
          <path d="M12 20v2"></path>
          <path d="m4.93 4.93 1.41 1.41"></path>
          <path d="m17.66 17.66 1.41 1.41"></path>
          <path d="M2 12h2"></path>
          <path d="M20 12h2"></path>
          <path d="m6.34 17.66-1.41 1.41"></path>
          <path d="m19.07 4.93-1.41 1.41"></path>
        </svg>
      </span>
      <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M20 14.5A7.6 7.6 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"></path>
        </svg>
      </span>
    </button>

    <main class="profile" aria-labelledby="profile-name">
      <figure class="portrait">
        <img src="profile.jpg" alt="Tomckyのプロフィール画像">
      </figure>

      <h1 id="profile-name">Tomcky</h1>
      <p class="tagline">
        <span>Forward Deployed Engineer</span>
        <span>Product Management / Product Ops</span>
      </p>

      <nav class="links" aria-label="Tomcky links">
        <a href="https://x.com/tomcky_san" target="_blank" rel="noopener noreferrer">X</a>
        <a href="https://github.com/TomckySan" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="https://tomcky.hatenadiary.jp/" target="_blank" rel="noopener noreferrer">はてなブログ</a>
      </nav>
    </main>
    <script>
      (() => {
        const themeToggle = document.querySelector(".theme-toggle");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)");

        const getActiveTheme = () =>
          document.documentElement.dataset.theme ||
          (prefersDark.matches ? "dark" : "light");

        const syncThemeToggle = () => {
          const activeTheme = getActiveTheme();
          const nextTheme = activeTheme === "dark" ? "light" : "dark";

          themeToggle.setAttribute("aria-label", `Switch to ${nextTheme} mode`);
          themeToggle.setAttribute("aria-pressed", activeTheme === "dark");
        };

        themeToggle.addEventListener("click", () => {
          const nextTheme = getActiveTheme() === "dark" ? "light" : "dark";

          document.documentElement.dataset.theme = nextTheme;

          try {
            localStorage.setItem("theme", nextTheme);
          } catch {
            // The visual toggle should still work when storage is unavailable.
          }

          syncThemeToggle();
        });

        prefersDark.addEventListener("change", () => {
          if (!document.documentElement.dataset.theme) {
            syncThemeToggle();
          }
        });

        syncThemeToggle();
      })();
    </script>
  </body>
</html>
